name: Update Volt Policies

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests pymupdf
      
      - name: Check for new PDFs
        run: |
          python .github/scripts/check_new_pdfs.py
      
      - name: Fetch RSS feeds
        run: |
          python .github/scripts/fetch_news.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes
          git add cache/
          git add known_pdfs.json
          
          # Check if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            
            # Count new files
            NEW_PDFS=$(git diff --cached --name-only | grep -c "\.txt$" || true)
            NEW_NEWS=$(git diff --cached --name-only | grep -c "news_" || true)
            
            MSG="Update: "
            [ "$NEW_PDFS" -gt 0 ] && MSG="${MSG}${NEW_PDFS} new text files, "
            [ "$NEW_NEWS" -gt 0 ] && MSG="${MSG}news feeds, "
            MSG="${MSG%-2} - $TIMESTAMP"
            
            git commit -m "$MSG"
            git push
          fi
