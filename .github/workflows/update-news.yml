name: Update Volt Policies

on:
  schedule:
    - cron: '0 6 * * *'  # Once daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      # Nur ein Boolean, kein Freitext -> keine Injection-Fläche.
      force_restart:
        description: 'HF Space auch ohne Datenänderung neu starten (Index warm halten)'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sentence-transformers faiss-cpu numpy pymupdf beautifulsoup4
      
      - name: Check for new PDFs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/check_new_pdfs.py
      
      - name: Audit policy URLs & cache
        # Bericht im CI-Log; bricht den Update-Lauf nicht ab (Volt-Seiten
        # antworten sporadisch nicht -> kein False-Positive-Fail des Tagesjobs)
        continue-on-error: true
        run: python scripts/audit_policy_urls.py
      
      - name: Fetch news (incremental)
        # Feeds werden tolerant geparst; tote Feeds werden geloggt und
        # uebersprungen (Liste am Ende des Logs), der Schritt schlägt nie fehl.
        run: python .github/scripts/fetch_news.py
      
      - name: Build FAISS semantic index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/build_index.py
      
      - name: Generate status & sources
        run: |
          python .github/scripts/generate_status.py
          python .github/scripts/generate_sources.py
      
      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add cache/ known_pdfs.json STATUS.md SOURCES.md
          
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --cached --stat | tail -1)
            git commit -m "Auto-update: $CHANGED"
            git pull --rebase origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restart HuggingFace Space
        # Neuer Index -> Space sofort neu starten, damit der fertige Index
        # schon warm ist und nicht erst beim ersten User lädt. Der Space klont
        # das GitHub-Repo beim Start und lädt cache/faiss.index + chunks.json;
        # ohne Neustart behält der laufende Space seinen alten Index im Speicher.
        #
        # Ursache des früheren HTTP 401: das Repo-Secret HF_TOKEN war nie
        # gesetzt. Der Header ging als 'Authorization: Bearer ' (leer) raus,
        # HF antwortet darauf mit 401 ("Invalid username or password.") - auch
        # ohne Header. Der Header selbst war korrekt interpoliert.
        # Secret setzen: Settings -> Secrets and variables -> Actions ->
        # New repository secret, Name HF_TOKEN, Wert = HF-Token von harrytyp
        # (Schreibrechte). Der Guard unten bricht sonst mit ::error:: ab.
        # Manuell erzwingbar über workflow_dispatch input force_restart.
        if: steps.commit.outputs.pushed == 'true' || inputs.force_restart == true
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "Kein Repo-Secret HF_TOKEN gesetzt, Schritt uebersprungen. Der Space laedt seinen Index inzwischen selbst nach (Pull-Thread in app.py), der Neustart ist nur noch Zugabe."
            exit 0
          fi
          RESTART_URL="https://huggingface.co/api/spaces/harrytyp/voltpolicies/restart"
          HTTP=""
          for attempt in 1 2 3; do
            HTTP=$(curl -sS -o /tmp/hf_restart.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $HF_TOKEN" \
              "$RESTART_URL")
            echo "Space restart attempt $attempt -> HTTP $HTTP"
            [ "$HTTP" = "200" ] && break
            cat /tmp/hf_restart.json || true
            sleep 15
          done
          if [ "$HTTP" != "200" ]; then
            echo "::error::Space restart failed (HTTP $HTTP)"
            exit 1
          fi
          # Nachkontrolle: Space muss wieder RUNNING werden
          for i in 1 2 3 4 5 6; do
            sleep 10
            STAGE=$(curl -sS "https://huggingface.co/api/spaces/harrytyp/voltpolicies" \
              | grep -o '"stage":"[A-Za-z]*"' | head -1)
            echo "Space runtime $STAGE (check $i/6)"
            echo "$STAGE" | grep -q '"stage":"RUNNING"' && break
          done
          echo "::notice::Space restart triggered (HTTP 200)"
