name: Update Volt Policies

on:
  schedule:
    - cron: '0 6 * * *'  # Once daily at 06:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install sentence-transformers faiss-cpu numpy pymupdf
      
      - name: Check for new PDFs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/check_new_pdfs.py
      
      - name: Fetch news (incremental)
        run: python .github/scripts/fetch_news.py
      
      - name: Build FAISS semantic index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/build_index.py
      
      - name: Generate status & sources
        run: |
          python .github/scripts/generate_status.py
          python .github/scripts/generate_sources.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add cache/ known_pdfs.json STATUS.md SOURCES.md
          
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            CHANGED=$(git diff --cached --stat | tail -1)
            git commit -m "Auto-update: $CHANGED"
            git pull --rebase origin main
            git push origin main
          fi
